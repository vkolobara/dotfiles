onboarding = false
[theme]
name = "kanagawa"
auto_switch = false

[ui]
sidebar_width = 36
sidebar_max_width = 36
# Attention queue (blocked/done first); herdr has no recency sort.
agent_panel_sort = "priority"
# Distinct glyphs per state, so blocked and working differ without relying on color.
status_indicators = "symbols"
# Kanagawa crystal blue, matching the agent title rows below.
accent = "#7E9CD8"
# Split pane borders show the agent label when the pane has no manual name.
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
# Window manager titles show the workspace and the focused agent's task.
window_title = "{workspace}: {terminal_title}"

# Desktop notifications when a background agent blocks or finishes; prefix+o jumps to it.
[ui.toast]
delivery = "system"

[experimental]
# Keep pane scrollback across server restarts, alongside session.resume_agents_on_restore.
pane_history = true

[keys]
# prefix+1..9 focuses agents; tabs move to prefix+alt+1..9
focus_agent = "prefix+1..9"
switch_tab = "prefix+alt+1..9"
# prefix+n/p cycle agents; tabs move to prefix+[ / prefix+]
next_agent = "prefix+n"
previous_agent = "prefix+p"
next_tab = "prefix+]"
previous_tab = "prefix+["
# prefix+shift+j/k walk workspaces down and up the sidebar.
next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"
# Back to the previously focused pane, like tmux; prefix+tab stays cycle_pane_next.
last_pane = "prefix+semicolon"
# lazygit takes prefix+g, so goto moves to prefix+alt+g.
goto = "prefix+alt+g"

# Fuzzy agent picker: fzf over `herdr agent list`, focus the selected pane.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "~/.config/herdr/agent-picker.sh"
width = "70%"
height = "50%"
description = "agents"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
description = "lazygit"

# Agent rows use built-in tokens only: status and agent, the agent's title, then workspace and tab.
# Name agents yourself with `herdr agent rename <pane> <name>`; the agent picker shows that name first.
[ui.sidebar.agents]
rows = [
  ["state_icon", "state_text", { token = "agent", dim = true }],
  [{ token = "terminal_title_stripped", fg = "#7E9CD8", bold = true }],
  [{ token = "workspace", dim = true }, { token = "tab", dim = true }],
]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]
