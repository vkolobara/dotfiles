onboarding = false
[theme]
name = "kanagawa"
auto_switch = false

[ui]
sidebar_width = 36
sidebar_max_width = 36
# Attention queue (blocked/done first); herdr has no recency sort.
agent_panel_sort = "priority"
# Distinct glyphs per state, so blocked and working differ without relying on color.
status_indicators = "symbols"
# Kanagawa crystal blue, matching the agent title rows below.
accent = "#7E9CD8"
# Split pane borders show the agent label when the pane has no manual name.
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
# Window manager titles show the workspace and the focused agent's task.
window_title = "{workspace}: {terminal_title}"

# Desktop notifications when a background agent blocks or finishes; prefix+o jumps to it.
[ui.toast]
delivery = "system"

[experimental]
# Keep pane scrollback across server restarts, alongside session.resume_agents_on_restore.
pane_history = true

[keys]
# prefix+1..9 focuses agents; tabs move to prefix+alt+1..9
focus_agent = "prefix+1..9"
switch_tab = "prefix+alt+1..9"
# prefix+n/p cycle agents; tabs move to prefix+[ / prefix+]
next_agent = "prefix+n"
previous_agent = "prefix+p"
next_tab = "prefix+]"
previous_tab = "prefix+["
# prefix+shift+j/k walk workspaces down and up the sidebar.
next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"
# Back to the previously focused pane, like tmux; prefix+tab stays cycle_pane_next.
last_pane = "prefix+semicolon"
# lazygit takes prefix+g, so goto moves to prefix+alt+g.
goto = "prefix+alt+g"
# prefix+[ now selects the previous tab, so copy mode (yank) moves to prefix+y.
copy_mode = "prefix+y"

# Fuzzy agent picker: fzf over `herdr agent list`, focus the selected pane.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "~/.config/herdr/agent-picker.sh"
width = "80%"
height = "85%"
description = "agents"

# Fuzzy workspace picker: open workspaces plus git projects; a project opens as a new workspace.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "~/.config/herdr/workspace-picker.sh"
width = "70%"
height = "50%"
description = "workspaces"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
description = "lazygit"

# Review the focused pane's repo; prefix+r stays resize mode.
[[keys.command]]
key = "prefix+d"
type = "popup"
command = "tuicr"
width = "95%"
height = "95%"
description = "tuicr review"

# prefix+k stays focus-pane-up.
[[keys.command]]
key = "prefix+alt+k"
type = "popup"
command = "k9s"
width = "90%"
height = "90%"
description = "k9s"

# Quick edit in the focused pane's directory; prefix+e stays edit-scrollback.
[[keys.command]]
key = "prefix+alt+e"
type = "popup"
command = "nvim"
width = "90%"
height = "90%"
description = "nvim"

# New task: worktree beside the repo plus an agent (claude by default) and an optional first prompt.
[[keys.command]]
key = "prefix+alt+n"
type = "popup"
command = "~/.config/herdr/task-launcher.sh"
width = "70%"
height = "50%"
description = "new task"

# Finish a task: remove the active worktree checkout, keeping its branch.
[[keys.command]]
key = "prefix+alt+x"
type = "popup"
command = "~/.config/herdr/task-teardown.sh"
width = "70%"
height = "60%"
description = "finish task"

# Agent rows: status and agent with Claude's model and context use, the agent's title, then workspace and tab.
# $model and $ctx come from claude/statusline.sh; other agents simply omit them.
# $ctx leads with ○ below 50%, ◐ from 50%, and ● from 80%, matching the status line's colors.
# Name agents yourself with `herdr agent rename <pane> <name>`; the agent picker shows that name first.
[ui.sidebar.agents]
rows = [
  [
    "state_icon", "state_text", { token = "agent", dim = true }, { token = "$model", dim = true },
    { token = "$ctx", rules = [
      { starts_with = "●", fg = "#E46876", bold = true },
      { starts_with = "◐", fg = "#E6C384" },
      { starts_with = "○", fg = "#98BB6C" },
    ] },
  ],
  [{ token = "terminal_title_stripped", fg = "#7E9CD8", bold = true }],
  [{ token = "workspace", dim = true }, { token = "tab", dim = true }],
]

[ui.sidebar.spaces]
# $pr and $ci come from plugins/pr-status; rows without a PR collapse away.
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [
    { token = "$pr", dim = true, rules = [
      { contains = "approved", fg = "#98BB6C", dim = false },
      { contains = "changes", fg = "#FF5D62", dim = false },
      { contains = "merged", fg = "#957FB8", dim = false },
    ] },
    { token = "$ci", rules = [
      { equals = "✓ ci", fg = "#98BB6C" },
      { equals = "✗ ci", fg = "#FF5D62", bold = true },
      { equals = "● ci", fg = "#E6C384" },
    ] },
  ],
]
