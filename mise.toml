min_version = "2026.10.15"

[vars]
platform = "{% if os() == 'linux' %}arch{% else %}{{os()}}{% endif %}"
package_manager = "{% if os() == 'macos' %}homebrew{% else %}pacman{% endif %}"

[settings.task]
run_auto_install = false

[dotfiles]
# Symlink whole files. Merge only when an app writes the file or several fragments share it.
"~/.config/nvim" = { source = "nvim", mode = "symlink" }
# WezTerm was replaced by Ghostty; remove the old config symlink from machines that still have it.
"~/.config/wezterm" = { mode = "absent" }
"~/.config/ghostty/config.ghostty" = { source = "ghostty/config.ghostty", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "mise/global.toml", mode = "symlink" }
"~/.config/fish/config.fish" = { source = "shell/config.fish", mode = "symlink" }
"~/.config/niri" = { source = "niri", mode = "symlink", variants = [{ os = "linux" }] }
"~/.config/git/config" = { source = "git/config", mode = "symlink" }
"~/.config/lazygit/config.yml" = { source = "lazygit/config.yml", mode = "symlink" }
"~/.config/atuin/config.toml" = { source = "atuin/config.toml", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "herdr/config.toml", mode = "symlink" }
"~/.config/herdr/agent-picker.sh" = { source = "herdr/agent-picker.sh", mode = "symlink" }
"~/.config/herdr/workspace-picker.sh" = { source = "herdr/workspace-picker.sh", mode = "symlink" }
"~/.config/herdr/task-launcher.sh" = { source = "herdr/task-launcher.sh", mode = "symlink" }
"~/.config/herdr/task-teardown.sh" = { source = "herdr/task-teardown.sh", mode = "symlink" }
"~/.config/fish/kanagawa.fish" = { source = "shell/kanagawa.fish", mode = "symlink" }
"~/.config/atuin/themes/kanagawa.toml" = { source = "atuin/themes/kanagawa.toml", mode = "symlink" }
"~/.config/bat/themes/kanagawa.tmTheme" = { source = "themes/kanagawa.tmTheme", mode = "symlink" }
"~/.config/btop/themes/kanagawa.theme" = { source = "btop/themes/kanagawa.theme", mode = "symlink" }
"~/.config/k9s/skins/kanagawa.yaml" = { source = "k9s/skins/kanagawa.yaml", mode = "symlink" }
"~/.config/k9s/config.yaml/theme" = { source = "k9s/config.yaml", merge = true }
"~/.codex/themes/kanagawa.tmTheme" = { source = "themes/kanagawa.tmTheme", mode = "symlink" }
"~/.codex/config.toml/theme" = { source = "codex/theme.toml", merge = true }
"~/.config/DankMaterialShell/themes/kanagawa.json" = { source = "dms/themes/kanagawa.json", mode = "symlink", variants = [{ os = "linux" }] }
"~/.config/environment.d/qt-theme.conf" = { source = "desktop/qt-theme.conf", mode = "symlink", variants = [{ os = "linux" }] }
"~/.codex/config.toml/defaults" = { source = "codex/defaults.toml", merge = "missing" }
"~/.claude/settings.json/defaults" = { source = "claude/defaults.json", merge = "missing" }
"~/.claude/themes/kanagawa.json" = { source = "claude/kanagawa.json", mode = "symlink" }
"~/.claude/settings.json/theme" = { source = "claude/theme.json", merge = true }
"~/.claude/settings.json/updates" = { source = "claude/updates.json", merge = true }
"~/.claude/statusline.sh" = { source = "claude/statusline.sh", mode = "symlink" }
"~/.claude/settings.json/statusline" = { source = "claude/statusline.json", merge = true }
# Keep the diff sidebar closed; it lives in the global state file, not settings.json.
"~/.claude.json/diff-sidebar" = { source = "claude/diff-sidebar.json", merge = true }
"~/.cursor/cli-config.json/defaults" = { source = "cursor/defaults.json", merge = "missing" }
"~/.local/bin/agent" = { source = "shell/bin/agent", mode = "symlink" }
"~/.config/agents/AGENTS.md" = { source = "agents/AGENTS.md", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "agents/AGENTS.md", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "agents/AGENTS.md", mode = "symlink" }
"~/.agents/skills/investigate" = { source = "agents/skills/investigate", mode = "symlink" }
"~/.agents/skills/local-review" = { source = "agents/skills/local-review", mode = "symlink" }
"~/.agents/skills/local-review-fix" = { source = "agents/skills/local-review-fix", mode = "symlink" }
"~/.agents/skills/simplify-change" = { source = "agents/skills/simplify-change", mode = "symlink" }
"~/.agents/skills/prepare-pr" = { source = "agents/skills/prepare-pr", mode = "symlink" }
"~/.agents/skills/handoff" = { source = "agents/skills/handoff", mode = "symlink" }
"~/.agents/skills/herdr" = { source = "agents/skills/herdr", mode = "symlink" }
"~/.claude/skills/investigate" = { source = "agents/skills/investigate", mode = "symlink" }
"~/.claude/skills/local-review" = { source = "agents/skills/local-review", mode = "symlink" }
"~/.claude/skills/local-review-fix" = { source = "agents/skills/local-review-fix", mode = "symlink" }
"~/.claude/skills/simplify-change" = { source = "agents/skills/simplify-change", mode = "symlink" }
"~/.claude/skills/prepare-pr" = { source = "agents/skills/prepare-pr", mode = "symlink" }
"~/.claude/skills/handoff" = { source = "agents/skills/handoff", mode = "symlink" }
"~/.claude/skills/herdr" = { source = "agents/skills/herdr", mode = "symlink" }
"~/.cursor/hooks/shared-instructions.py" = { source = "agents/cursor-context.py", mode = "symlink" }
"~/.cursor/hooks.json" = { source = "cursor/hooks.json", mode = "symlink" }

[tasks.bootstrap]
description = "Install global development tools after deploying configuration"
run = [
  'mise --cd "$HOME" install',
  'mise run herdr-setup',
  'python3 themes/apply.py',
  'bat cache --build',
  'if [ "{{os()}}" = "linux" ]; then mise -E arch run fonts; fi',
]

[tasks.herdr-setup]
description = "Install herdr agent-state hooks and link the dotfiles' herdr plugins"
# Herdr writes these hooks into each agent's own config, outside the dotfiles.
# cursor/hooks.json already registers the hook, and the installer would append a
# duplicate absolute-path entry through the symlink, so keep the tracked copy.
run = [
  'for agent in claude codex opencode pi; do mise --cd "$HOME" exec -- herdr integration install "$agent"; done',
  'cp cursor/hooks.json "${TMPDIR:-/tmp}/cursor-hooks.json" && mise --cd "$HOME" exec -- herdr integration install cursor; cp "${TMPDIR:-/tmp}/cursor-hooks.json" cursor/hooks.json',
  # Linked in place, so edits under herdr/plugins apply without relinking.
  'mise --cd "$HOME" exec -- herdr plugin link "$PWD/herdr/plugins/pr-status"',
]

[tasks.default]
description = "Preview development setup; use --apply to install"
alias = "setup"
usage = '''
flag "--apply" help="Apply setup instead of previewing it"
flag "--brew" help="Use Homebrew for shared tools, including on Arch"
'''
env.PATH = "{{env.HOME}}/.local/bin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/bin:{{env.PATH}}"
run = 'MISE_ENV="{{vars.platform}},{% if usage.brew %}homebrew{% else %}{{vars.package_manager}}{% endif %}" mise bootstrap {% if not usage.apply %}--dry-run{% endif %}'

[tasks.preview]
description = "Preview this machine's selected bootstrap configuration"
run = 'mise run default'

[tasks.check]
description = "Check declared packages, configuration, and development tools"
usage = '''
flag "--brew" help="Use Homebrew for shared tools, including on Arch"
'''
env.PATH = "{{env.HOME}}/.local/bin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:{{env.PATH}}"
run = 'MISE_ENV="{{vars.platform}},{% if usage.brew %}homebrew{% else %}{{vars.package_manager}}{% endif %}" mise bootstrap status --missing'

[tasks.test]
description = "Validate mise tasks and theme deployment"
run = ["mise tasks validate", "python3 -m unittest discover -s themes"]

[tasks.theme]
description = "Deploy Kanagawa and refresh syntax and desktop themes"
run = [
  'mise -E "{{vars.platform}}" dot apply',
  "python3 themes/apply.py",
  "bat cache --build",
  '{% if os() == "linux" %}dms ipc call theme dark{% else %}true{% endif %}',
]
